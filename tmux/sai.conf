# Sai (佐為) — tmux side: per-pane output capture + the pull binding.
# Sourced from ~/.tmux.conf by `sai init` (idempotent marker block).
#
# NOTE: tmux expands $HOME at config-parse time (shell ${VAR:-default} syntax
# is NOT supported here and would make the whole line fail to parse). Paths
# are host-scoped via #{host_short} so NFS-shared homes never mix hosts
# (PLAN.md §16.5). If your sai state root is not ~/.local/state/sai, edit
# these three paths.

# Pipe every NEW pane's output (-O: output only, no keystrokes) to a per-pane
# log the daemon tails. Existing panes are covered by `sai init`. The mkdir
# guard covers a freshly ssh-ed host whose state dir does not exist yet.
set-hook -g after-new-session 'pipe-pane -O "mkdir -p \"$HOME/.local/state/sai/#{host_short}\" && exec cat >>\"$HOME/.local/state/sai/#{host_short}/out-#{pane_id}.log\""'
set-hook -g after-new-window 'pipe-pane -O "mkdir -p \"$HOME/.local/state/sai/#{host_short}\" && exec cat >>\"$HOME/.local/state/sai/#{host_short}/out-#{pane_id}.log\""'
set-hook -g after-split-window 'pipe-pane -O "mkdir -p \"$HOME/.local/state/sai/#{host_short}\" && exec cat >>\"$HOME/.local/state/sai/#{host_short}/out-#{pane_id}.log\""'

# Pull: prefix + g → ask Sai why (unlimited; PLAN.md §10). Requires tmux ≥ 3.2.
bind-key g display-popup -E -w 80% -h 60% "sai pull; printf '\n[press any key]'; read -k1 -s || read -n1 -s"
