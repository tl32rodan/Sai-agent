# Sai (佐為) — tmux side: per-pane output capture + the pull binding.
# Sourced from ~/.tmux.conf by `sai init` (idempotent marker block).

# Pipe every NEW pane's output (-O: output only, no keystrokes) to a per-pane
# log the daemon tails. Existing panes are covered by `sai init`.
set-hook -g after-new-session 'pipe-pane -O "exec cat >> \"${XDG_STATE_HOME:-$HOME/.local/state}/sai/out-#{pane_id}.log\""'
set-hook -g after-new-window  'pipe-pane -O "exec cat >> \"${XDG_STATE_HOME:-$HOME/.local/state}/sai/out-#{pane_id}.log\""'
set-hook -g after-split-window 'pipe-pane -O "exec cat >> \"${XDG_STATE_HOME:-$HOME/.local/state}/sai/out-#{pane_id}.log\""'

# Pull: prefix + g → ask Sai why (unlimited; PLAN.md §10). Requires tmux ≥ 3.2.
bind-key g display-popup -E -w 80% -h 60% "sai pull; printf '\n[press any key]'; read -k1 -s || read -n1 -s"
